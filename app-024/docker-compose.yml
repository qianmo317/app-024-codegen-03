services:
  app-024:
    build: .
    image: app-024-codegen-03-lantern-riddle:latest
    container_name: app-024-codegen-03
    ports:
      - "8124:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
